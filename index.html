<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aether Weather | Global Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-dashboard">
        <aside class="weather-sidebar">
            <div class="nav-icon active">🌤️</div>
            <div class="nav-icon">📍</div>
            <div class="nav-icon">⚙️</div>
        </aside>

        <main class="weather-main">
            <div class="search-bar">
                <input type="text" placeholder="Search for cities...">
            </div>

            <div class="current-weather-card">
                <div class="weather-text">
                    <h2>Madrid</h2>
                    <p>Chance of rain: 0%</p>
                    <h1>31°</h1>
                </div>
                <div class="weather-icon-3d">☀️</div>
            </div>

            <div class="forecast-grid">
                <div class="sub-card">
                    <h3>REAL FEEL</h3>
                    <p class="metric-value">30°</p>
                </div>
                <div class="sub-card">
                    <h3>WIND</h3>
                    <p class="metric-value">0.2 km/h</p>
                </div>
            </div>
        </main>
    </div>
    <script src="weather.js"></script>
</body>
</html>
